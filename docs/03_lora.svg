<text x="542" y="174" class="ts" text-anchor="start" >sin pista: la antena va al U.FL del módulo</text>
<text x="40" y="538" class="ts" text-anchor="start" >Conmutador de RF interno gobernado por DIO2 (V1 = ANT_SW1 = DIO2, p. 9); DIO2 no sale del módulo.</text>
<text x="40" y="557" class="tw" text-anchor="start" >⇒ variante: SX126X_DIO2_AS_RF_SWITCH y SIN SX126X_RXEN / SX126X_TXEN (P1.12 y P1.13 quedan libres).</text>
<text x="40" y="576" class="ts" text-anchor="start" >Cristal PASIVO de 32 MHz (Y1 a XTA/XTB en el esquema interno, p. 9): DIO3 al aire.</text>
<text x="40" y="595" class="tw" text-anchor="start" >⇒ la variante NO define SX126X_DIO3_TCXO_VOLTAGE (igual que con el E22-900MM22S).</text>
<text x="40" y="614" class="ts" text-anchor="start" >Patas 2, 3 y 14 NC (pedido estándar: R1 0 Ω / R2 NC dentro del módulo ⇒ 14 = NC).</text>
<text x="40" y="633" class="ts" text-anchor="start" >NRST con pull-up interno del SX1262: lo mueve el MCU (LORA_NRST). SPI hasta 16 MHz (P1 limita a 8).</text>
<text x="40" y="652" class="ts" text-anchor="start" >Pedir la versión SX1262 (3N62AI-X): el LLCC68 no hace SF11/BW250 (LongFast). Mismo hardware EU868/US915.</text>
<rect x="900" y="76" width="800" height="300" rx="7" class="frame"/>
