<text x="1325.6" y="144.5" class="ll" text-anchor="middle" >VDD_LORA</text>
<text x="920" y="240" class="ts" text-anchor="start" >FB301 = π que pide Minew (3V3 sale del BUCK2): 0 Ω de serie; ferrita CBW160808U601T</text>
<text x="920" y="259" class="ts" text-anchor="start" >(#4: 1 A, 0,4 Ω ⇒ 50 mV en TX) si el buck se cuela en la recepción. Igual que FB201.</text>
<text x="920" y="278" class="ts" text-anchor="start" >C301/C302 a ≤ 0,5 mm de la pata 8, con dos vías a GND (§8.3).</text>
<text x="920" y="297" class="ts" text-anchor="start" >Consumo a 3,3 V (p. 9): TX 22 dBm 112–123 mA de pico · RX 4,76 mA · sleep ≈ 0,9 µA.</text>
<rect x="900" y="390" width="800" height="246" rx="7" class="frame"/>
<text x="912" y="410" class="ft" text-anchor="start" >C · Qué cambia respecto a la rev 0.1 (E22-900MM22S)</text>
<text x="920" y="430" class="ts" text-anchor="start" >Fuera: J301 (U.FL), π de antena R304/C304, R301/R302 (TXEN) y R303 (pull-down de RXEN).</text>
<text x="920" y="451" class="ts" text-anchor="start" >C303 cambia de función: ahora es la entrada de la π de alimentación (10 µF).</text>
<text x="920" y="472" class="tw" text-anchor="start" >Desaparecen LORA_RXEN (P1.13) y LORA_TXEN (P1.12): fuera de la hoja 02 y de la raíz.</text>
<text x="920" y="493" class="ts" text-anchor="start" >Igual que antes: LORA_SCK/MOSI/MISO/NSS/BUSY/DIO1/NRST en los mismos puertos (castellados</text>
<text x="920" y="514" class="ts" text-anchor="start" >12-18 del ME54BS13) y 3V3 siempre vivo (mismo raíl que el MCU: sin estado parcial).</text>
<text x="920" y="535" class="ts" text-anchor="start" >Huella meshnode:MS21SF1 (la de Minew, 16 castellados paso 1,8) y STEP MS21SF1_PCB_V1.0 ya en libs/.</text>
<text x="920" y="556" class="ts" text-anchor="start" >El módulo es 16,4 × 15 × 3 mm (el E22 era 10 × 10): la colocación de la franja LoRa cambia.</text>
<rect x="20" y="694" width="860" height="296" rx="7" class="frame"/>
<text x="32" y="714" class="ft" text-anchor="start" >D · Notas de colocación (Minew §8.2–8.5)</text>
<text x="36" y="734" class="ts" text-anchor="start" >• U.FL del módulo hacia un canto, con el cable de antena saliendo por fuera; nada metálico encima.</text>
<text x="36" y="755" class="ts" text-anchor="start" >• 0,5 mm alrededor del módulo sin pistas ni piezas que no sean GND; plano GND continuo debajo</text>
<text x="36" y="776" class="ts" text-anchor="start" >    (In1 entero) y una vía a GND junto a cada pad de GND (1, 7, 15).</text>
<text x="36" y="797" class="ts" text-anchor="start" >• Pata 16 (ANT) sin pista y rodeada sólo de GND: es RF aunque aquí no se use.</text>
<text x="36" y="818" class="ts" text-anchor="start" >• Minew pide 20 mm a bucks/inductores, 25 mm a pantallas y 50 mm entre módulos: en 40 × 86 mm no</text>
<text x="36" y="839" class="ts" text-anchor="start" >    cabe ⇒ como en la rev 0.1: planos GND continuos, módulos en zonas distintas y L101/L102 lejos.</text>
<text x="36" y="860" class="ts" text-anchor="start" >• ≥ 5 mm a tornillos (H1–H4, M2) y ~4 mm libres alrededor para soldar y retrabajar.</text>
<text x="36" y="881" class="tp" text-anchor="start" >• Plantilla: Minew recomienda 0,2 mm escalonada (+0,8 mm) en el módulo y la placa usa 0,10 mm</text>
<text x="36" y="902" class="tp" text-anchor="start" >    ⇒ revisar la pasta de los castellados en la huella antes de pedir el stencil.</text>
<rect x="900" y="650" width="800" height="340" rx="7" class="frame"/>
